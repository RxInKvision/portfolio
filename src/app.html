<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0b0b0b" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="preload" href="%sveltekit.assets%/fonts/ABCFavorit-Regular.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="%sveltekit.assets%/fonts/ABCFavoritMono-Regular.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			// Pick language before first paint to avoid a flash of the wrong copy.
			try {
				const saved = localStorage.getItem('rxink-lang');
				const lang = saved || ((navigator.language || '').slice(0, 2) === 'it' ? 'it' : 'en');
				document.documentElement.lang = lang;
				document.documentElement.dataset.lang = lang;
			} catch (e) {}
			document.documentElement.classList.add('js');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
